name: scrape (manual maintenance)

# Emergency re-scrape and one-shot API backfill. The daily schedule lives in
# daily.yml so mail cannot start independently of a successful scrape.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only this archive key (gov-support / busan-startup / kstartup-biz / kstartup-mentoring / kstartup-global)'
        type: string
        default: ''
      dry_run:
        description: 'Run scrapers but do not write to DB'
        type: boolean
        default: false
      backfill_details:
        description: 'One-shot: refresh existing bizinfo enrichment and GPU·AI labels from the keyed official API. Bypasses normal scrape.'
        type: boolean
        default: false
      bizinfo_timeout:
        description: 'Override Bizinfo per-attempt timeout in seconds (1-900; default 300)'
        type: string
        default: ''

permissions:
  contents: read   # scrape does not commit anything to this repo

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: macos-latest
    # At the maximum manual 900-second request timeout, Bizinfo can spend
    # roughly 165 minutes in extended recovery. Keep generous headroom.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev

      - name: orchestrate
        env:
          # Scrape only needs Turso. Mail-only secrets are intentionally not
          # exposed to this step (least-privilege).
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN:   ${{ secrets.TURSO_AUTH_TOKEN }}
          BIZINFO_API_KEY:    ${{ secrets.BIZINFO_API_KEY }}
          ONLY:               ${{ inputs.only }}
          DRY_RUN:            ${{ inputs.dry_run }}
          BACKFILL_DETAILS:   ${{ inputs.backfill_details }}
          BIZINFO_LIST_PAGE_TIMEOUT: ${{ inputs.bizinfo_timeout }}
        run: |
          set -euo pipefail
          if [ "${BACKFILL_DETAILS:-false}" = "true" ]; then
            # Historical input/CLI name retained; implementation is API-only.
            uv run --frozen python -m src.cli --backfill-bizinfo-api
          else
            args=(--scrape)
            [ "${DRY_RUN:-false}" = "true" ] && args+=(--dry-run)
            if [ -n "${ONLY:-}" ]; then args+=(--only "$ONLY"); fi
            uv run --frozen python -m src.cli "${args[@]}"
          fi
