name: scrape

# 07:30 KST = 22:30 UTC. Scrapes the 10+ Korean gov/startup sources, diffs
# against yesterday's Turso daily_status, classifies items as new/ongoing/expired,
# and writes today's rows. Gives the mail workflow (08:30 KST) a fresh DB to
# read from. 60-min gap absorbs slow / retried source fetches.

on:
  schedule:
    - cron: '30 22 * * *'   # 22:30 UTC = 07:30 KST next day
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only this archive key (gov-support / busan-startup / kstartup-biz / kstartup-mentoring / kstartup-global)'
        type: string
        default: ''
      dry_run:
        description: 'Run scrapers but do not write to DB'
        type: boolean
        default: false
      backfill_details:
        description: 'One-shot: fetch DETAIL pages for every existing bizinfo item, re-apply GPU·AI labels (~25 min). Bypasses normal scrape.'
        type: boolean
        default: false

permissions:
  contents: read   # scrape does not commit anything to this repo

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 30 min normally; backfill can run ~25 min in the worst case, so we
    # add headroom. Daily cron doesn't need the full window.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -e .

      - name: orchestrate
        env:
          # Scrape only needs Turso. Mail-only secrets are intentionally not
          # exposed to this step (least-privilege).
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN:   ${{ secrets.TURSO_AUTH_TOKEN }}
          ONLY:               ${{ inputs.only }}
          DRY_RUN:            ${{ inputs.dry_run }}
          BACKFILL_DETAILS:   ${{ inputs.backfill_details }}
        run: |
          set -euo pipefail
          if [ "${BACKFILL_DETAILS:-false}" = "true" ]; then
            # One-shot detail backfill — bypasses scrape stage entirely
            python -m src.cli --backfill-details
          else
            args=(--scrape)
            [ "${DRY_RUN:-false}" = "true" ] && args+=(--dry-run)
            if [ -n "${ONLY:-}" ]; then args+=(--only "$ONLY"); fi
            python -m src.cli "${args[@]}"
          fi
