name: scrape (manual maintenance)

# Emergency re-scrape and one-shot detail backfill. The daily schedule lives in
# daily.yml so mail cannot start independently of a successful scrape.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only this archive key (gov-support / busan-startup / kstartup-biz / kstartup-mentoring / kstartup-global)'
        type: string
        default: ''
      dry_run:
        description: 'Run scrapers but do not write to DB'
        type: boolean
        default: false
      backfill_details:
        description: 'One-shot: fetch DETAIL pages for every existing bizinfo item, re-apply GPU·AI labels (~25 min). Bypasses normal scrape.'
        type: boolean
        default: false

permissions:
  contents: read   # scrape does not commit anything to this repo

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 30 min normally; backfill can run ~25 min in the worst case, so we
    # add headroom. Daily cron doesn't need the full window.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev

      - name: orchestrate
        env:
          # Scrape only needs Turso. Mail-only secrets are intentionally not
          # exposed to this step (least-privilege).
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN:   ${{ secrets.TURSO_AUTH_TOKEN }}
          BIZINFO_API_KEY:    ${{ secrets.BIZINFO_API_KEY }}
          ONLY:               ${{ inputs.only }}
          DRY_RUN:            ${{ inputs.dry_run }}
          BACKFILL_DETAILS:   ${{ inputs.backfill_details }}
        run: |
          set -euo pipefail
          if [ "${BACKFILL_DETAILS:-false}" = "true" ]; then
            # One-shot detail backfill — bypasses scrape stage entirely
            uv run --frozen python -m src.cli --backfill-details
          else
            args=(--scrape)
            [ "${DRY_RUN:-false}" = "true" ] && args+=(--dry-run)
            if [ -n "${ONLY:-}" ]; then args+=(--only "$ONLY"); fi
            uv run --frozen python -m src.cli "${args[@]}"
          fi
