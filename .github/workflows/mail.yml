name: mail (manual recovery)

# Emergency mail retry for an already-complete daily snapshot. The regular
# schedule lives in daily.yml and depends directly on its scrape job.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore today sent-marker and re-send'
        type: boolean
        default: false
      only:
        description: 'Run only this archive key (gov-support / busan-startup / kstartup-biz / kstartup-mentoring / kstartup-global)'
        type: string
        default: ''
      dry_run:
        description: 'Render but do not send mail or push archives'
        type: boolean
        default: false
      no_cc:
        description: 'Send without CC (test send to MAIL_TO only)'
        type: boolean
        default: false

permissions:
  contents: write   # to commit state/sent-*.marker back to this repo

concurrency:
  # Block overlap with scrape.yml — if scrape is still finishing when mail
  # fires, mail waits. Same-day re-dispatch is also serialized.
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev

      - name: orchestrate
        env:
          GMAIL_USER:           ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:   ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO:              ${{ secrets.MAIL_TO }}
          MAIL_CC_GOV_SUPPORT:  ${{ secrets.MAIL_CC_GOV_SUPPORT }}
          ARCHIVE_PUSH_TOKEN:   ${{ secrets.ARCHIVE_PUSH_TOKEN }}
          TURSO_DATABASE_URL:   ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN:     ${{ secrets.TURSO_AUTH_TOKEN }}
          FORCE:                ${{ inputs.force }}
          ONLY:                 ${{ inputs.only }}
          DRY_RUN:              ${{ inputs.dry_run }}
          NO_CC:                ${{ inputs.no_cc }}
        run: |
          set -euo pipefail
          if [ "${NO_CC:-false}" = "true" ]; then export MAIL_CC_GOV_SUPPORT=""; fi
          args=(--mail)
          [ "${DRY_RUN:-false}" = "true" ] && args+=(--dry-run)
          [ "${FORCE:-false}"   = "true" ] && args+=(--force)
          if [ -n "${ONLY:-}" ]; then args+=(--only "$ONLY"); fi
          uv run --frozen python -m src.cli "${args[@]}"

      - name: commit state
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain state/ 2>/dev/null)" ]; then
            echo "no state changes"
            exit 0
          fi
          git -c user.name='pathcosmos-bot' \
              -c user.email='bot@users.noreply.github.com' \
              add state/
          git -c user.name='pathcosmos-bot' \
              -c user.email='bot@users.noreply.github.com' \
              commit -m "state: $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
